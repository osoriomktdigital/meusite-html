<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes é foda</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:radial-gradient(circle at 30% 20%,#1e3a8a,#0f172a 70%);
       font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#f8fafc}
  .card{text-align:center;padding:3rem 2rem;max-width:90vw}
  h1{font-size:clamp(2rem,6vw,4rem);font-weight:800;letter-spacing:-.02em;
     background:linear-gradient(90deg,#4ade80,#22d3ee);-webkit-background-clip:text;
     background-clip:text;-webkit-text-fill-color:transparent}
  p{margin-top:1rem;color:#94a3b8;font-size:1.1rem}
  .badge{display:inline-block;margin-top:1.5rem;padding:.4rem .9rem;border-radius:999px;
         background:#1e293b;color:#4ade80;font-size:.85rem;border:1px solid #334155}
</style>
</head>
<body>
  <main class="card">
    <h1>O Hermes é foda</h1>
    <p>Página de teste publicada automaticamente via Hermes + GitHub Pages.</p>
    <span class="badge">deploy automático ✅</span>
  </main>
</body>
</html>
