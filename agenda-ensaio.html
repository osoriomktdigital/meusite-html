<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de Ensaio — Lumina Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#0b0d14;color:#f0f0f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{text-align:center;padding:3rem 2rem;max-width:640px;background:linear-gradient(135deg,#13152a,#1a1d35);border-radius:24px;box-shadow:0 25px 60px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.06)}
h1{font-size:2.4rem;font-weight:800;background:linear-gradient(90deg,#c8a97e,#e6cfa3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.02em;margin-bottom:.6rem}
.subtitle{color:#a0a6b8;font-size:1.05rem;margin-bottom:2rem}
.info{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;margin-bottom:2rem}
.info span{background:rgba(255,255,255,.05);padding:.5rem 1rem;border-radius:999px;color:#c8a97e;font-weight:600;font-size:.9rem;border:1px solid rgba(200,169,126,.2)}
.cta{display:inline-block;padding:.9rem 2rem;background:linear-gradient(90deg,#c8a97e,#bfa36e);color:#0b0d14;font-weight:800;border-radius:12px;text-decoration:none;font-size:1.05rem;transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(200,169,126,.35)}
footer{margin-top:1.8rem;color:#555;font-size:.78rem}
</style>
</head>
<body>
<main class="card">
  <h1>Agenda de Ensaio</h1>
  <p class="subtitle">Lumina Studio — Fotografia Autoral</p>
  <div class="info">
    <span>Retratos Autoriais</span>
    <span>Ensaios Editoriais</span>
    <span>Coleções de Memórias</span>
  </div>
  <a class="cta" href="#">Reservar Horário →</a>
  <footer>Publicado automaticamente via Hermes + GitHub Pages</footer>
</main>
</body>
</html>
